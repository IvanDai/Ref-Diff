[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rid2026"
version = "0.1.0"
description = "Complex-baseband simulation core and RID2026 dataset generator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.9",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rid2026*", "refdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
