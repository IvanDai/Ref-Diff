seed: 233
device: auto
output_dir: outputs/baseline

dataset:
  root: datasets/rml2018_sim
  target: x_pure
  filters:
    profiles: [rml2018_full]
    modulations: [BPSK, QPSK, 8PSK, 16QAM]
    esn0_db: [-10, 30]

model:
  base_channels: 32
  channel_mults: [1, 2, 4]

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  num_workers: 4
